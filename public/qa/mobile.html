<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zenfy · Verificação temporária de mobile</title><style>body{margin:0;padding:24px;background:#e8edf5;font:16px system-ui;color:#06114f}label{display:inline-block;margin:0 20px 16px 0}select{padding:10px;font:inherit}iframe{display:block;background:white;border:1px solid #ccc;box-shadow:0 16px 60px #06114f20;width:390px;height:844px}p{max-width:800px}</style></head><body><h1>Verificação temporária de mobile</h1><p>Esta página será retirada após conferir o layout publicado. O quadro carrega as páginas reais do site no tamanho selecionado.</p><label>Largura <select id="width"><option>320</option><option selected>390</option><option>640</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Altura <select id="height"><option>400</option><option>568</option><option selected>844</option></select></label><label>Página <select id="route"><option value="/">Início</option><option value="/solicitar-orcamento">Orçamento</option><option value="/portfolio">Projetos</option><option value="/sobre">Equipe</option><option value="/login">Entrar</option></select></label><iframe title="Site Zenfy no tamanho selecionado" src="/"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';document.querySelector('#height').onchange=e=>frame.style.height=e.target.value+'px';document.querySelector('#route').onchange=e=>frame.src=e.target.value;</script></body></html>
